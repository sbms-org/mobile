name: Android universal APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: android-apk-universal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build universal Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.6
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build one APK for all supported ABIs
        run: >-
          flutter build apk --release
          --target-platform android-arm,android-arm64,android-x64

      - name: Upload CI-signed universal APK
        uses: actions/upload-artifact@v4
        with:
          name: sbms-android-universal-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
